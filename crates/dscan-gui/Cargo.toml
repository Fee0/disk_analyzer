[package]
name = "dscan-gui"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "disk-analyzer"
path = "src/main.rs"

[dependencies]
dscan-core = { path = "../dscan-core" }
iced = { version = "0.14", features = ["canvas", "svg", "tokio", "advanced"] }
rfd = "0.17"
mimalloc = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
