[workspace]
resolver = "3"
members = ["crates/dscan-core", "crates/dscan-gui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Every dependency is declared here, without default features; member crates
# only write `name.workspace = true`. Enable just the features the code needs.
[workspace.dependencies]
dscan-core = { path = "crates/dscan-core", default-features = false }

# core
libc = { version = "0.2", default-features = false }
rayon = { version = "1", default-features = false }
memchr = { version = "2", default-features = false, features = ["std"] }
rustc-hash = { version = "2", default-features = false, features = ["std"] }
parking_lot = { version = "0.12", default-features = false }
thiserror = { version = "2", default-features = false, features = ["std"] }
humansize = { version = "2", default-features = false }
trash = { version = "5", default-features = false, features = ["freedesktop", "coinit_apartmentthreaded"] }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSURL",
    "NSString",
    "NSValue",
    "NSDictionary",
    "NSArray",
    "NSError",
] }

# gui
iced = { version = "0.14", default-features = false, features = [
    "wgpu",      # GPU renderer
    "tiny-skia", # software fallback when no GPU adapter is available
    "crisp",
    "canvas",
    "svg",
    "tokio",
    "advanced",
    "x11",     # Linux window systems
    "wayland",
] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
mimalloc = { version = "0.1", default-features = false }

# gui build: icon and version info for the Windows executable
winresource = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

# tests
tempfile = { version = "3", default-features = false }
iced_test = { version = "0.14", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# `cargo build --profile profiling` keeps symbols for flamegraphs and profilers.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 2

# Code that runs once at startup (shader translation, SVG icon parsing) or never
# (raster decoders pulled in by resvg) is optimised for size; hot paths stay at -O3.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.rustybuzz]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.simplecss]
opt-level = "s"
[profile.release.package.imagesize]
opt-level = "s"
[profile.release.package.fdeflate]
opt-level = "s"
[profile.release.package.codespan-reporting]
opt-level = "s"
